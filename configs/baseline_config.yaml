# Ilādṛṣṭi Baseline Pipeline Configuration
# Track 6: AI for Science & Society (Deep Learning Hackathon)

seed: 42

data:
  data_dir: "data"
  in_channels: 4          # 4 for RGB + NIR, 3 for RGB ablation
  scale_factor: 10000.0   # Sentinel-2 L2A surface reflectance normalization
  batch_size: 16
  num_workers: 2

model:
  name: "WildfireBaselineUNet"
  encoder: "resnet50"
  pretrained: true
  num_classes: 1

training:
  epochs: 25
  lr: 0.0001
  weight_decay: 0.0001
  loss: "BCEWithLogitsLoss"
  checkpoint_dir: "checkpoints"
  checkpoint_name: "best_baseline_model.pt"
  output_dir: "outputs"

evaluation:
  threshold: 0.5
  output_json: "outputs/evaluation_results.json"
